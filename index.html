<!DOCTYPE html>
<html lang="en">
<head>
<style>
@media print {
  @page { size: landscape; margin: 0.3in; }
  body { background: white !important; }
  body * { visibility: hidden !important; }
  .month-page, .month-page * { visibility: visible !important; }
  .month-page { position: absolute; left: 0; top: 0; width: 100%; page-break-after: always; }
  .month-page:not(:first-of-type) { page-break-before: always; }
  .calendar-grid { width: 100% !important; transform: scale(0.92); transform-origin: top left; }
  .day { min-height: 80px; border: 1px solid black; padding: 4px; font-size: 11px; white-space: pre-wrap; }
  header, nav, form, input, button, .no-print, .pill-actions, .modal-overlay { display: none !important; }
}
</style>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Summer With Daddy 2026</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; background: #f4f6fb; color: #222; }
header { position: sticky; top: 0; z-index: 10; background: linear-gradient(90deg, #ffb347, #ff5e62); color: white; padding: 16px; text-align: center; }
header h1 { margin: 0; font-size: 22px; }
.subtitle { font-size: 14px; opacity: 0.9; }
.container { max-width: 1100px; margin: auto; padding: 12px; }
.form-box { background: white; border-radius: 16px; padding: 16px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.form-box h3 { margin-top: 0; }
.form-row { display: flex; gap: 10px; flex-wrap: wrap; }
.form-row > * { flex: 1; min-width: 140px; }
input, select, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 10px; border: 1px solid #ccc; font-size: 14px; }
button { background: #ff5e62; color: white; border: none; font-weight: bold; cursor: pointer; }
button:hover { background: #e04e52; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.legend-dot { width: 14px; height: 14px; border-radius: 50%; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 30px; }
.weekday { text-align: center; font-weight: bold; padding: 8px; }
.day-cell { background: white; border-radius: 12px; min-height: 95px; padding: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); font-size: 12px; }
.day-number { font-weight: bold; margin-bottom: 6px; font-size: 14px; }
.event-pill { border-radius: 8px; padding: 4px 6px; margin-top: 4px; font-size: 11px; display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.pill-text { flex: 1; }
.pill-actions { display: flex; gap: 2px; opacity: 0; transition: opacity 0.15s; }
.event-pill:hover .pill-actions { opacity: 1; }
.pill-btn { background: none; border: none; cursor: pointer; padding: 0 2px; font-size: 11px; width: auto; margin: 0; color: #555; }
.pill-btn:hover { color: #000; background: none; }
.month-title { margin: 24px 0 12px; }
.color-select { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.color-opt { width: 28px; height: 28px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: border-color 0.15s; }
.color-opt.selected { border-color: #333; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: white; border-radius: 16px; padding: 24px; width: 100%; max-width: 420px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
.modal h3 { margin-top: 0; }
.modal-actions { display: flex; gap: 10px; margin-top: 10px; }
.modal-actions button { margin-top: 0; }
.btn-cancel { background: #999; }
.btn-cancel:hover { background: #777; }
@media (max-width: 700px) {
  .calendar-grid { gap: 4px; }
  .day-cell { min-height: 75px; font-size: 10px; padding: 5px; }
  .event-pill { font-size: 9px; }
  .day-number { font-size: 12px; }
  .pill-actions { opacity: 1; }
}
</style>
</head>
<body>
<header>
  <h1>&#9728;&#65039; Summer With Daddy 2026 &#9728;&#65039;</h1>
  <div class="subtitle">Schedule of events</div>
</header>
<div class="container">
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#ffadad"></div> Daddy &amp; Mommy</div>
    <div class="legend-item"><div class="legend-dot" style="background:#bde0fe"></div> Daddy with Kids</div>
    <div class="legend-item"><div class="legend-dot" style="background:#caffbf"></div> Family</div>
    <div class="legend-item"><div class="legend-dot" style="background:#fff1b8"></div> Ben</div>
    <div class="legend-item"><div class="legend-dot" style="background:#d0bdf4"></div> Hannah</div>
    <div class="legend-item"><div class="legend-dot" style="background:#d9d9d9"></div> Holiday/Birthday</div>
  </div>
  <div class="form-box no-print">
    <h3>Add Event</h3>
    <div class="form-row">
      <div><label>Start Date</label><input id="startDate" type="date" /></div>
      <div><label>End Date (optional)</label><input id="endDate" type="date" /></div>
    </div>
    <input id="eventName" type="text" placeholder="Event name" />
    <input id="emoji" type="text" placeholder="Emoji (optional)" maxlength="2" />
    <label style="margin-top:10px;display:block;font-size:13px;">Color</label>
    <div class="color-select" id="colorPicker">
      <div class="color-opt selected" data-color="blue" style="background:#bde0fe" title="Daddy with Kids"></div>
      <div class="color-opt" data-color="red" style="background:#ffadad" title="Daddy &amp; Mommy"></div>
      <div class="color-opt" data-color="green" style="background:#caffbf" title="Family"></div>
      <div class="color-opt" data-color="yellow" style="background:#fff1b8" title="Ben"></div>
      <div class="color-opt" data-color="purple" style="background:#d0bdf4" title="Hannah"></div>
      <div class="color-opt" data-color="grey" style="background:#d9d9d9" title="Holiday/Birthday"></div>
    </div>
    <button onclick="addEvent()" style="margin-top:14px;">Add Event</button>
  </div>
  <h2 class="month-title">&#127774; June 2026</h2>
  <div id="june" class="calendar-grid"></div>
  <h2 class="month-title">&#127482;&#127480; July 2026</h2>
  <div id="july" class="calendar-grid"></div>
  <h2 class="month-title">&#127796; August 2026</h2>
  <div id="august" class="calendar-grid"></div>
</div>
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>Edit Event</h3>
    <input type="hidden" id="editId" />
    <label>Start Date</label><input id="editStartDate" type="date" />
    <label>End Date</label><input id="editEndDate" type="date" />
    <label>Event Name</label><input id="editEventName" type="text" />
    <label>Emoji</label><input id="editEmoji" type="text" maxlength="2" />
    <label style="margin-top:10px;display:block;font-size:13px;">Color</label>
    <div class="color-select" id="editColorPicker">
      <div class="color-opt" data-color="blue" style="background:#bde0fe" title="Daddy with Kids"></div>
      <div class="color-opt" data-color="red" style="background:#ffadad" title="Daddy &amp; Mommy"></div>
      <div class="color-opt" data-color="green" style="background:#caffbf" title="Family"></div>
      <div class="color-opt" data-color="yellow" style="background:#fff1b8" title="Ben"></div>
      <div class="color-opt" data-color="purple" style="background:#d0bdf4" title="Hannah"></div>
      <div class="color-opt" data-color="grey" style="background:#d9d9d9" title="Holiday/Birthday"></div>
    </div>
    <div class="modal-actions">
      <button onclick="saveEdit()">Save</button>
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>
<script>
var SUPA = "https://ahdcdasfqhqsimxmfpkj.supabase.co";
var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFoZGNkYXNmcWhxc2lteG1mcGtqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMDUyNjIsImV4cCI6MjA5NTg4MTI2Mn0.dvA3I_Nb1JxGXFYGDWQAzwXTmsfqNvBVVxjG_UOqFsg";
var HDR = {"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json","Prefer":"return=representation"};
var COLORS = {blue:"#bde0fe",green:"#caffbf",red:"#ffadad",yellow:"#fff1b8",purple:"#d0bdf4",grey:"#d9d9d9"};
var DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function pickColor(pid) {
  document.querySelectorAll("#"+pid+" .color-opt").forEach(function(el) {
    el.addEventListener("click", function() {
      document.querySelectorAll("#"+pid+" .color-opt").forEach(function(e){e.classList.remove("selected");});
      el.classList.add("selected");
    });
  });
}
pickColor("colorPicker");
pickColor("editColorPicker");

function getColor(pid) {
  var s = document.querySelector("#"+pid+" .color-opt.selected");
  return s ? s.dataset.color : "blue";
}
function setColor(pid, c) {
  document.querySelectorAll("#"+pid+" .color-opt").forEach(function(e){
    e.classList.toggle("selected", e.dataset.color === c);
  });
}

function pad(n){ return String(n).padStart(2,"0"); }

async function loadCalendar() {
  var res = await fetch(SUPA+"/rest/v1/events?select=*&order=startDate.asc", {headers:HDR});
  var ev = await res.json();
  if (!Array.isArray(ev)) { console.error("Supabase error", ev); return; }
  buildMonth("june",  2026, 5, 30, ev);
  buildMonth("july",  2026, 6, 31, ev);
  buildMonth("august",2026, 7, 31, ev);
}

function buildMonth(cId, year, mi, dim, events) {
  var c = document.getElementById(cId);
  c.innerHTML = "";
  DAYS.forEach(function(d){ var h=document.createElement("div"); h.className="weekday"; h.textContent=d; c.appendChild(h); });
  var fd = new Date(year, mi, 1).getDay();
  for (var i=0; i<fd; i++) c.appendChild(document.createElement("div"));
  for (var day=1; day<=dim; day++) {
    var cell = document.createElement("div"); cell.className = "day-cell";
    var num  = document.createElement("div"); num.className  = "day-number"; num.textContent = day; cell.appendChild(num);
    var ds = year+"-"+pad(mi+1)+"-"+pad(day);
    events.forEach(function(ev) {
      var s = ev.startDate, e = ev.endDate || s;
      if (ds >= s && ds <= e) {
        var pill = document.createElement("div"); pill.className = "event-pill"; pill.dataset.id = ev.id;
        var col = (ev.color||"blue").toLowerCase(); pill.style.background = COLORS[col]||"#bde0fe";
        var txt = document.createElement("span"); txt.className = "pill-text"; txt.textContent = (ev.emoji||"")+" "+(ev.event||"");
        var acts = document.createElement("span"); acts.className = "pill-actions";
        var eb = document.createElement("button"); eb.className="pill-btn"; eb.textContent="Edit"; eb.title="Edit";
        eb.addEventListener("click", function(){ openEdit(pill.dataset.id); });
        var db = document.createElement("button"); db.className="pill-btn"; db.textContent="Del"; db.title="Delete";
        db.addEventListener("click", function(){ deleteEvent(pill.dataset.id); });
        acts.appendChild(eb); acts.appendChild(db);
        pill.appendChild(txt); pill.appendChild(acts); cell.appendChild(pill);
      }
    });
    c.appendChild(cell);
  }
}

async function addEvent() {
  var sd=document.getElementById("startDate").value, ed=document.getElementById("endDate").value||sd;
  var ev=document.getElementById("eventName").value.trim(), em=document.getElementById("emoji").value.trim();
  var col=getColor("colorPicker");
  if (!sd||!ev) { alert("Please enter a date and event name."); return; }
  var res = await fetch(SUPA+"/rest/v1/events", {method:"POST",headers:HDR,body:JSON.stringify({startDate:sd,endDate:ed,event:ev,emoji:em,color:col})});
  if (res.ok) {
    document.getElementById("startDate").value=""; document.getElementById("endDate").value="";
    document.getElementById("eventName").value=""; document.getElementById("emoji").value="";
    setColor("colorPicker","blue"); loadCalendar();
  } else { alert("Failed to add event."); }
}

async function openEdit(id) {
  var res = await fetch(SUPA+"/rest/v1/events?id=eq."+id+"&select=*", {headers:HDR});
  var data = await res.json(); var ev = data[0]; if (!ev) return;
  document.getElementById("editId").value       = ev.id;
  document.getElementById("editStartDate").value = ev.startDate||"";
  document.getElementById("editEndDate").value   = ev.endDate||"";
  document.getElementById("editEventName").value = ev.event||"";
  document.getElementById("editEmoji").value     = ev.emoji||"";
  setColor("editColorPicker",(ev.color||"blue").toLowerCase());
  document.getElementById("editModal").classList.add("open");
}
function closeModal(){ document.getElementById("editModal").classList.remove("open"); }

async function saveEdit() {
  var id=document.getElementById("editId").value;
  var sd=document.getElementById("editStartDate").value, ed=document.getElementById("editEndDate").value||sd;
  var ev=document.getElementById("editEventName").value.trim(), em=document.getElementById("editEmoji").value.trim();
  var col=getColor("editColorPicker");
  if (!sd||!ev) { alert("Please fill in date and event name."); return; }
  var res = await fetch(SUPA+"/rest/v1/events?id=eq."+id, {method:"PATCH",headers:HDR,body:JSON.stringify({startDate:sd,endDate:ed,event:ev,emoji:em,color:col})});
  if (res.ok) { closeModal(); loadCalendar(); } else { alert("Failed to save changes."); }
}

async function deleteEvent(id) {
  if (!confirm("Delete this event?")) return;
  var res = await fetch(SUPA+"/rest/v1/events?id=eq."+id, {method:"DELETE",headers:HDR});
  if (res.ok) loadCalendar(); else alert("Failed to delete event.");
}

document.getElementById("editModal").addEventListener("click", function(e){
  if (e.target===document.getElementById("editModal")) closeModal();
});

loadCalendar();
</script>
</body>
</html>
